plugins { id 'com.android.application' }

android {
    namespace 'br.drummond.provador3d'
    compileSdk 34
    defaultConfig {
        applicationId 'br.drummond.provador3d'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }
    // Chave fixa no repositório: app de uso pessoal, instalado por fora da loja.
    // Assim cada versão nova instala por cima da anterior, venha de onde vier a compilação.
    signingConfigs {
        provador {
            storeFile file("$rootDir/provador.keystore")
            storePassword 'provador3d'
            keyAlias 'provador'
            keyPassword 'provador3d'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.provador }
        release { minifyEnabled false; signingConfig signingConfigs.provador }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // o editor offline vem da pasta app/ da extensão (mesmo código do PC)
    sourceSets { main { assets.srcDirs = ['src/main/assets', "$rootDir/build/offline-assets"] } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

tasks.register('copyOfflineApp', Copy) {
    from "$rootDir/../app"
    into "$rootDir/build/offline-assets/offline"
}
preBuild.dependsOn copyOfflineApp
