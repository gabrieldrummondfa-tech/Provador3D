<style>
/* Layout: estúdio escuro — viewport 3D à esquerda (topo no celular), painel de ajustes à direita (embaixo no celular) */
:root{
  --studio:#121315; --panel:#1a1b1e; --raise:#24262a; --line:#2f3237;
  --ink:#ece9e4; --muted:#9a978f; --tape:#e8c35a; --tape-ink:#1b1708;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--studio);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage{position:relative;min-width:0;background:radial-gradient(120% 90% at 50% 35%,#2a2b2f 0%,#17181a 55%,#0d0e0f 100%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.brand{position:absolute;left:16px;top:14px;display:flex;align-items:baseline;gap:10px;pointer-events:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tape{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.tape div{background:var(--tape);color:var(--tape-ink);font-family:var(--f-mono);font-size:12px;padding:4px 8px 4px 8px;border-radius:2px;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 1px,transparent 1px 6px);background-size:100% 4px;background-repeat:no-repeat;background-position:0 0}
.tape b{font-weight:500;font-variant-numeric:tabular-nums}
.tape small{opacity:.7;margin-right:4px;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.views{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.views button{font:500 12px var(--f-body);background:rgba(26,27,30,.8);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;backdrop-filter:blur(6px)}
.views button:hover{border-color:var(--muted)}
.frame{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);aspect-ratio:832/1216;max-width:100%;box-shadow:0 0 0 9999px rgba(0,0,0,.45);outline:1px solid var(--tape);pointer-events:none}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.thumbs figure{margin:0;display:flex;flex-direction:column;gap:4px}
.thumbs img{width:100%;aspect-ratio:832/1216;object-fit:cover;background:var(--raise);border-radius:4px;border:1px solid var(--line)}
.thumbs figcaption{font-size:11px;color:var(--muted)}
ol.steps{margin:6px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}
ol.steps code{font-family:var(--f-mono);font-size:11.5px;background:var(--raise);padding:1px 4px;border-radius:3px;word-break:break-all}
.srv{display:flex;flex-direction:column;gap:8px;padding:12px;margin:12px 0 4px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:6px;background:var(--raise);font-size:13px;line-height:1.45}
.srv.ok{border-left-color:#5fb37a}.srv.warn{border-left-color:var(--tape)}.srv.bad{border-left-color:#d0614f}
.srv p{margin:0}.srv label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.srv select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px;font:13px var(--f-body);max-width:100%}
.srv code,.note code{font-family:var(--f-mono);font-size:11.5px;background:var(--panel);padding:1px 4px;border-radius:3px;word-break:break-all}
.srv .btn{align-self:flex-start}
.dlrow{display:flex;flex-direction:column;gap:4px;margin:4px 0}.dlrow small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.gen{display:flex;flex-direction:column;gap:10px;padding:16px 0 6px}
.btn.big{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-size:15px;padding:12px 16px;font-weight:600}
.btn.big:disabled{opacity:.6}
.prog{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.track{height:6px;background:var(--raise);border-radius:3px;overflow:hidden}.fill{height:100%;width:0;background:var(--tape);transition:width .3s}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.gi{padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;background:var(--raise);aspect-ratio:832/1216}
.gi img{width:100%;height:100%;object-fit:cover;display:block}.gi.gone{display:none}
.lb{position:fixed;inset:0;z-index:20;background:rgba(8,8,9,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;min-height:0;flex:1;object-fit:contain}
.lbbar{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font:12px var(--f-mono)}
.lbbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
a.btn{text-decoration:none;display:inline-block}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px 10px}
.btn{font:500 13px var(--f-body);background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,.sw:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.tabs{display:flex;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{font:600 13px var(--f-body);background:none;border:0;color:var(--muted);padding:10px 8px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.list{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;display:flex;flex-direction:column;gap:2px}
.row{padding:9px 0 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.row label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;margin-bottom:7px}
.row output{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .hint{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--trk,var(--raise))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--trk,var(--raise))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--panel);margin-top:-7px;box-shadow:0 0 0 1px var(--line)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--panel)}
.sect{font:500 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--tape);box-shadow:0 0 0 2px var(--panel) inset}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{display:flex;flex-direction:column;gap:4px}
.slot small{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center}
textarea{width:100%;box-sizing:border-box;min-height:70px;background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px var(--f-mono);padding:8px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tape);color:var(--tape-ink);font:500 13px var(--f-body);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.warn{color:var(--tape)}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:54% 46%}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .bar{padding:10px 16px 8px}
  .btn{padding:6px 9px;font-size:12px}
  .brand span{display:none}
  .tape div{font-size:11px;padding:3px 6px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

<script type="module">
import * as THREE from 'three';

/* ---------- dados ---------- */
const META = await fetch('meta.json', { cache:'no-cache' }).then(r=>r.json());

const BUF = await loadPack();
const M = META.mesh;
const NV = M.nv;
const BASE = new Float32Array(BUF, M.pos, NV*3);
const INDEX = new Uint32Array(BUF, M.idx, M.nt*3);
const GRP = new Uint8Array(BUF, M.grp, NV);
const T = {};
for (const t of META.targets) T[t.n] = { idx:new Uint16Array(BUF, t.i, t.c), d:new Int16Array(BUF, t.d, t.c*3), s:t.s };

/* ---------- estado ---------- */
const MACRO_DEF = { gender:0, weight:.45, muscle:.4, height:.5, prop:.7, cup:.6, firm:.55 };
const PAIRS = ['bust','brpos','brdist','brpoint','brvert','shoulder','pec','dorsi','vshape','torsow','waist','belly','neck',
  'hipw','hips','glute','uarm','uarmfat','uarmmus','larm','armlen','thigh','thighfat','thighmus','calf','leglen',
  'faceshape','cheekb','jaw','chinw','nose','nosew','nosetip','lips','mouthw','eyesz','brow'];
const PAIR_DEF = { waist:-0.2, hips:0.15, glute:0.15, shoulder:-0.15, neck:-0.15, faceshape:0.45, jaw:-0.3, chinw:-0.25, nose:-0.25, nosew:-0.2, nosetip:0.15, lips:0.35, eyesz:0.15, cheekb:0.2, uarmmus:-0.2 };
const SKINS = ['#f3d2c1','#e8b896','#c98e6a','#a86d4b','#7a4a31','#4e2f20'];
const HAIRS = ['#16110e','#3b2416','#6b4423','#a77a45','#c9a46b','#8a3a1a','#8a8a88'];
const CLOTH = ['#1d1f24','#ece6dc','#7a2836','#c98b94','#2e4a6b','#3d5a45','#cdb595'];
const IRIS = ['#5a3a22','#7a5a2a','#4f6b3a','#4d6f8f','#6b6f73'];
const LIPS = ['#b5676a','#a23a45','#c4707a','#8a4a42','#d08a7e'];
const OUTFITS = ['Conjunto','Maiô','Top e short','Cropped e jeans'];
let S = freshState();
function freshState(){ const s = { m:{...MACRO_DEF}, p:{}, skin:1, hair:2, cloth:2, eye:0, lip:0, makeup:0.6, hairLen:0.75, outfit:0, ear:1, freckles:0, armOpen:0.22, legOpen:0.2, pose:1, age:1 }; for (const k of PAIRS) s.p[k]=PAIR_DEF[k]||0; return s; }
let extreme = false;

/* ---------- pesos dos alvos (modelo macro do MakeHuman) ---------- */
function tri(v){ return { min:Math.max(0,(.5-v)*2), average:1-Math.abs(v-.5)*2, max:Math.max(0,(v-.5)*2) }; }
function weights(){
  const W = new Map(); const add=(n,w)=>{ if (T[n] && Math.abs(w)>1e-4) W.set(n,(W.get(n)||0)+w); };
  const m = S.m; const g = { f:1-m.gender, m:m.gender };
  const mw = tri(m.muscle), ww = tri(m.weight);

    if (c==='average' && f==='average') continue;
    add(`br-${w}-${c}-${f}`, g.f*ww[w]*cw[c]*fw[f]);
  }
  add('nip-flat', 1.0);
  for (const k of PAIRS){ const v=S.p[k]; if (v<0) add(k+'-', -v); else if (v>0) add(k+'+', v); }
  return W;

/* ---------- cena ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
camera.position.set(0.5, 1.05, 4.3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0); controls.enableDamping = true; controls.minDistance = 0.45; controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI*0.53;

const key = new THREE.DirectionalLight(0xfff1e4, 2.6); key.position.set(-2.2, 3.6, 3.2);
key.castShadow = true; key.shadow.mapSize.set(2048,2048); key.shadow.radius = 6; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left:-1.4, right:1.4, top:2.3, bottom:-0.2, near:0.5, far:12 });
const fill = new THREE.DirectionalLight(0xc8d6ff, 0.65); fill.position.set(3, 1.6, 2.4);
const rim = new THREE.DirectionalLight(0xffffff, 1.7); rim.position.set(1.2, 2.8, -3.2);
const rim2 = new THREE.DirectionalLight(0xffe2cc, 0.9); rim2.position.set(-2.4, 1.2, -2.6);
scene.add(key, fill, rim, rim2, new THREE.HemisphereLight(0xdfe6ff, 0x2a2420, 0.25));
const ground = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.ShadowMaterial({ opacity:0.42 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const disc = new THREE.Mesh(new THREE.RingGeometry(0.62,0.64,96), new THREE.MeshBasicMaterial({ color:0xe8c35a, transparent:true, opacity:0.18 }));
disc.rotation.x = -Math.PI/2; disc.position.y = 0.001; scene.add(disc);

/* ---------- geometria compartilhada ---------- */
const pos = new Float32Array(BASE);
// subdivisão de Loop pré-calculada como operador linear esparso: suaviza a silhueta da malha base (13 mil vértices → 55 mil)
const LOOP = (()=>{
  const nv=NV, nt=M.nt, idx=INDEX, edgeMap=new Map(), E=[];
  const triE=new Uint32Array(nt*3);
  for (let t=0;t<nt;t++) for (let e=0;e<3;e++){
    const a=idx[t*3+e], b=idx[t*3+(e+1)%3], c=idx[t*3+(e+2)%3]; const key=a<b?a*nv+b:b*nv+a;
    let id=edgeMap.get(key); if (id===undefined){ id=E.length/4; edgeMap.set(key,id); E.push(a,b,c,-1); } else E[id*4+3]=c;
    triE[t*3+e]=id; }

    if (bnb[v].length===2){ cols.push(v,bnb[v][0],bnb[v][1]); ws.push(0.75,0.125,0.125); }

    else { const n=nbr[v].length, beta=n===3?3/16:3/(8*n); cols.push(v); ws.push(1-n*beta); for (const u of nbr[v]){ cols.push(u); ws.push(beta); } }

    if (d<0){ cols.push(a,b); ws.push(.5,.5); } else { cols.push(a,b,c,d); ws.push(.375,.375,.125,.125); } start.push(cols.length); }

function blobToData(b){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); }

/* ---------- gerador próprio: fala com o ComfyUI que serve este app ---------- */
const GEN = { base: location.protocol==='file:' ? 'http://127.0.0.1:8188' : location.origin, models:null, ckpt:'', cn:'', quality:1, count:1, results:[], ws:null, poll:null,
  clientId: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)) };
try { GEN.results = JSON.parse(localStorage.getItem('provador3d-fotos')||'[]'); } catch {}
function saveResults(){ try { localStorage.setItem('provador3d-fotos', JSON.stringify(GEN.results.slice(0,80))); } catch {} }
const jobs = new Map();
const sleep = ms => new Promise(r=>setTimeout(r, ms));
function comboList(info, node, field){ try { const v = info[node].input.required[field]; if (Array.isArray(v[0])) return v[0]; if (v[0]==='COMBO') return (v[1]&&v[1].options)||[]; } catch {} return []; }
async function checkServer(){
  try {
    const [a,b] = await Promise.all(['CheckpointLoaderSimple','ControlNetLoader'].map(n=>fetch(GEN.base+'/object_info/'+n).then(r=>{ if(!r.ok) throw 0; return r.json(); })));
    const ck = comboList(a,'CheckpointLoaderSimple','ckpt_name'), cn = comboList(b,'ControlNetLoader','control_net_name');
    GEN.models = { ck, cn };
    if (!ck.includes(GEN.ckpt)) GEN.ckpt = ck.find(n=>/realvis/i.test(n)) || ck.find(n=>/xl/i.test(n)) || ck[0] || '';
    if (!cn.includes(GEN.cn)) GEN.cn = cn.find(n=>/depth/i.test(n)) || '';
  } catch { GEN.models = false; }
}
function viewURL(r){ return `${GEN.base}/view?filename=${encodeURIComponent(r.f)}&subfolder=${encodeURIComponent(r.sf||'')}&type=output`; }
function graph(prompt, depthName){
  const seed = Math.floor(Math.random()*1e15), hi = GEN.quality===1;
  const g = {
    '1':{ class_type:'CheckpointLoaderSimple', inputs:{ ckpt_name:GEN.ckpt } },
    '2':{ class_type:'CLIPTextEncode', inputs:{ text:prompt, clip:['1',1] } },
    '3':{ class_type:'CLIPTextEncode', inputs:{ text:NEGATIVE, clip:['1',1] } },
    '9':{ class_type:'EmptyLatentImage', inputs:{ width:GW, height:GH, batch_size:GEN.count } },
  };
  let pos=['2',0], neg=['3',0];
  if (GEN.cn && depthName){
    g['4']={ class_type:'LoadImage', inputs:{ image:depthName } };
    g['5']={ class_type:'ControlNetLoader', inputs:{ control_net_name:GEN.cn } };
    g['6']={ class_type:'ControlNetApplyAdvanced', inputs:{ positive:pos, negative:neg, control_net:['5',0], image:['4',0], strength:PHOTO.strength, start_percent:0, end_percent:0.8 } };
    pos=['6',0]; neg=['6',1];
  }
  g['7']={ class_type:'KSampler', inputs:{ seed, steps:hi?28:20, cfg:4.5, sampler_name:'dpmpp_2m_sde', scheduler:'karras', denoise:1, model:['1',0], positive:pos, negative:neg, latent_image:['9',0] } };
  let lat=['7',0];
  if (hi){   // segunda passada em resolução maior: mais detalhe de pele e cabelo
    g['11']={ class_type:'LatentUpscaleBy', inputs:{ upscale_method:'nearest-exact', scale_by:1.4, samples:lat } };
    g['12']={ class_type:'KSampler', inputs:{ seed:seed+1, steps:16, cfg:4.5, sampler_name:'dpmpp_2m_sde', scheduler:'karras', denoise:0.42, model:['1',0], positive:pos, negative:neg, latent_image:['11',0] } };
    lat=['12',0];
  }
  g['8']={ class_type:'VAEDecode', inputs:{ samples:lat, vae:['1',2] } };
  g['10']={ class_type:'SaveImage', inputs:{ filename_prefix:'provador/foto', images:['8',0] } };
  return { g, seed };
}
async function uploadDepth(blob){
  const fd = new FormData(); fd.append('image', blob, `prof_${Date.now()}.png`); fd.append('type','input'); fd.append('subfolder','provador');
  const r = await fetch(GEN.base+'/upload/image', { method:'POST', body:fd });
  if (!r.ok) throw new Error('Não consegui enviar a guia de profundidade ao ComfyUI.');
  const j = await r.json(); return j.subfolder ? j.subfolder+'/'+j.name : j.name;
}
function openWS(){
  if (GEN.ws && GEN.ws.readyState < 2) return;
  try { const ws = new WebSocket(GEN.base.replace(/^http/,'ws')+'/ws?clientId='+GEN.clientId); GEN.ws = ws;
    ws.onmessage = e => { if (typeof e.data!=='string') return; let m; try { m = JSON.parse(e.data); } catch { return; } onWS(m); };
    ws.onclose = () => { GEN.ws = null; }; } catch {}
}
function onWS(m){
  const d = m.data||{}, job = jobs.get(d.prompt_id); if (!job) return;
  if (m.type==='execution_start' || m.type==='execution_cached') { job.state='run'; updateGenUI(); }
  if (m.type==='progress'){ job.state='run'; job.step=d.value; job.max=d.max; job.node=String(d.node||''); updateGenUI(); }
  if (m.type==='executing' && d.node){ job.state='run'; job.node=String(d.node); updateGenUI(); }
  if (m.type==='executing' && d.node===null) finishJob(d.prompt_id);
  if (m.type==='execution_success') finishJob(d.prompt_id);
  if (m.type==='execution_error'){ job.error = d.exception_message ? 'Erro no ComfyUI: '+String(d.exception_message).slice(0,160) : 'Erro na geração.'; finishJob(d.prompt_id); }
}
function startPoll(){
  if (GEN.poll) return;
  GEN.poll = setInterval(async()=>{
    if (!jobs.size){ clearInterval(GEN.poll); GEN.poll=null; return; }
    for (const id of [...jobs.keys()]){ try { const h = await fetch(GEN.base+'/history/'+id).then(r=>r.json()); if (h[id]) finishJob(id); } catch {} }
  }, 2500);
}
async function finishJob(id){
  const job = jobs.get(id); if (!job || job.done) return; job.done = true;
  let imgs = [];
  for (let i=0;i<12;i++){
    try { const h = await fetch(GEN.base+'/history/'+id).then(r=>r.json()); const e = h[id];
      if (e){ for (const k in (e.outputs||{})) for (const im of (e.outputs[k].images||[])) if (im.type==='output') imgs.push(im);
        if (e.status && e.status.status_str==='error' && !job.error) job.error = 'O ComfyUI informou um erro. Veja a janela dele para detalhes.'; break; } } catch {}
    await sleep(500);
  }
  jobs.delete(id);
  if (!imgs.length && !job.error) job.error = 'A geração terminou sem imagem.';
  imgs.reverse().forEach(im => GEN.results.unshift({ f:im.filename, sf:im.subfolder, seed:job.seed, t:Date.now() }));
  saveResults();
  if (job.error) toast(job.error); else { toast(imgs.length>1 ? `${imgs.length} fotos prontas` : 'Foto pronta'); openLightbox(0); }
  updateGenUI(true);
}
function explainError(j){
  const e = j.error||{}; let msg = e.message || 'O ComfyUI recusou o pedido.';
  for (const k in (j.node_errors||{})){ const x = (j.node_errors[k].errors||[])[0]; if (x){ msg += ': ' + (x.details || x.message); break; } }
  return msg;
}
async function generate(){
  if (!GEN.models || !GEN.ckpt){ toast('Falta o modelo de foto no ComfyUI. Veja o aviso acima.'); return; }
  const btn = $('genBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Preparando…'; }
  try {
    lastGuides = await renderGuides();
    const depthName = GEN.cn ? await uploadDepth(lastGuides.depth) : '';
    const ta = $('pr'); const prompt = (ta && ta.dataset.edited==='1') ? ta.value : describe();
    const { g, seed } = graph(prompt, depthName);
    openWS();
    const r = await fetch(GEN.base+'/prompt', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ prompt:g, client_id:GEN.clientId }) });
    const j = await r.json().catch(()=>({}));
    if (!r.ok || !j.prompt_id) throw new Error(explainError(j));
    jobs.set(j.prompt_id, { seed, state:'queue', step:0, max:0, node:'' }); startPoll();
  } catch(e){ toast(e && e.message ? e.message : 'Não consegui falar com o ComfyUI.'); }
  updateGenUI();
}
function updateGenUI(galleryToo){
  const btn = $('genBtn'), bar = $('genBar'), lab = $('genLab');
  if (btn){ btn.disabled = false; btn.textContent = jobs.size ? 'Gerar outra (entra na fila)' : 'Gerar foto'; }
  if (bar && lab){
    const job = [...jobs.values()][0];
    if (!job){ bar.parentElement.hidden = true; }
    else { bar.parentElement.hidden = false;
      const two = GEN.quality===1, stage = job.node==='12' ? 2 : 1;
      const frac = job.max ? job.step/job.max : 0, total = two ? (stage===1 ? frac*0.62 : 0.62+frac*0.38) : frac;
      bar.style.width = Math.round(total*100)+'%';
      lab.textContent = job.state==='queue' ? 'Na fila do ComfyUI…' : !job.max ? 'Carregando o modelo (a primeira vez demora mais)…'
        : `${two ? `Etapa ${stage} de 2 · ` : ''}passo ${job.step} de ${job.max}` + (jobs.size>1 ? ` · mais ${jobs.size-1} na fila` : ''); }
  }
  if (galleryToo) renderGallery();
}
function renderGallery(){
  const gal = $('gal'); if (!gal) return;
  if (!GEN.results.length){ gal.innerHTML = ''; return; }
  gal.innerHTML = '<div class="gal">' + GEN.results.slice(0,24).map((r,i)=>`<button class="gi" data-i="${i}" aria-label="Abrir foto ${i+1}"><img loading="lazy" src="${viewURL(r)}" alt=""></button>`).join('') + '</div>';
  gal.querySelectorAll('.gi').forEach(b => b.onclick = () => openLightbox(+b.dataset.i));
  gal.querySelectorAll('img').forEach(im => im.onerror = () => { im.parentElement.classList.add('gone'); });
}
let lbIndex = 0;
function openLightbox(i){
  if (!GEN.results.length) return; lbIndex = Math.max(0, Math.min(i, GEN.results.length-1));
  const r = GEN.results[lbIndex], lb = $('lb');
  $('lbImg').src = viewURL(r); $('lbDl').href = viewURL(r); $('lbDl').setAttribute('download', r.f);
  $('lbInfo').textContent = `${lbIndex+1} de ${GEN.results.length} · semente ${r.seed}`;
  $('lbPrev').disabled = lbIndex===0; $('lbNext').disabled = lbIndex>=GEN.results.length-1;
  lb.hidden = false; $('lbClose').focus();
}
function closeLightbox(){ $('lb').hidden = true; }
$('lbClose').onclick = closeLightbox; $('lbPrev').onclick = () => openLightbox(lbIndex-1); $('lbNext').onclick = () => openLightbox(lbIndex+1);
$('lbAgain').onclick = () => { closeLightbox(); generate(); };
$('lbDl').addEventListener('click', e => { if (!window.ProvadorNative) return; e.preventDefault(); const r = GEN.results[lbIndex]; if (!r) return;
  window.ProvadorNative.save(new URL(viewURL(r), location.href).href, r.f); toast('Salvando na galeria…'); });
window.__back = () => { if (!$('lb').hidden){ closeLightbox(); return true; } return false; };
document.addEventListener('keydown', e => { if ($('lb').hidden) return; if (e.key==='Escape') closeLightbox(); if (e.key==='ArrowLeft') openLightbox(lbIndex-1); if (e.key==='ArrowRight') openLightbox(lbIndex+1); });
function serverBlock(){
  const box = document.createElement('div'); box.className = 'srv'; box.id = 'srv'; listEl.append(box);
  const paint = () => {
    const M = GEN.models;
    if (M===null){ box.innerHTML = '<span class="dot"></span> Procurando o ComfyUI…'; return; }
    if (M===false){ box.className='srv bad';
      if (window.ProvadorNative){ box.innerHTML = `<b>Sem conexão com o PC.</b><p>O editor funciona normalmente. Para gerar fotos, deixe o ComfyUI aberto no PC, no mesmo Wi-Fi, com acesso pela rede ligado.</p><button class="btn big" id="nativeReconnect">Procurar o PC</button>`; $('nativeReconnect').onclick = () => window.ProvadorNative.reconnect(); }
      else box.innerHTML = `<b>Não encontrei o ComfyUI.</b> Abra este app pelo endereço do ComfyUI terminado em <code>/provador</code>, com o ComfyUI aberto no PC.`;
      return; }
    const sel = (id, list, cur) => `<select id="${id}">${list.map(n=>`<option ${n===cur?'selected':''}>${n.replace(/[<>&]/g,'')}</option>`).join('')}</select>`;
    let html = '';
    const needCk = !M.ck.length, needCn = !GEN.cn && !M.cn.some(n=>/depth/i.test(n));
    if (needCk || needCn){
      html += `<b>${needCk ? 'Faltam os modelos para gerar fotos.' : 'Falta a guia do corpo.'}</b><p>O app baixa sozinho para as pastas certas do ComfyUI${needCk ? ' (cerca de 9,5 GB)' : ' (cerca de 2,5 GB)'}. Pode continuar editando enquanto baixa.</p><div id="dlBox"></div><button class="btn big" id="dlBtn">Baixar modelos automaticamente</button>`;
    }
    if (needCk){ box.className='srv bad'; }
    else { box.className = GEN.cn ? 'srv ok' : 'srv warn';
      html += `<label for="selCk">Modelo de foto</label>${sel('selCk', M.ck, GEN.ckpt)}`;
      if (M.cn.length) html += `<label for="selCn">Guia do corpo (ControlNet)</label>${sel('selCn', ['(sem guia)', ...M.cn], GEN.cn||'(sem guia)')}`;
      if (!GEN.cn) html += `<p><b>Sem guia de corpo, a IA desenha um corpo do jeito dela.</b> Baixe <code>diffusion_pytorch_model.fp16.safetensors</code> de huggingface.co/diffusers/controlnet-depth-sdxl-1.0, renomeie para <code>controlnet-depth-sdxl-1.0.safetensors</code> e coloque em <code>ComfyUI/models/controlnet</code>.</p>`; }
    html += '<button class="btn" id="recheck">Verificar de novo</button>';
    box.innerHTML = html;
    const sc = $('selCk'), sn = $('selCn');
    if (sc) sc.onchange = () => { GEN.ckpt = sc.value; };
    if (sn) sn.onchange = () => { GEN.cn = sn.value==='(sem guia)' ? '' : sn.value; paint(); };
    $('recheck').onclick = async () => { GEN.models = null; paint(); await checkServer(); paint(); };
    const dl = $('dlBtn'); if (dl) dl.onclick = async () => { dl.disabled = true; try { await fetch(GEN.base+'/provador/api/download', { method:'POST' }); } catch {} watchDownload(paint); };
    if ((needCk || needCn) && DL.running) watchDownload(paint);
  };
  paint(); if (GEN.models===null) Promise.all([checkServer(), readDL()]).then(paint);
}
const DL = { running:false, timer:null };
function fmtGB(b){ return (b/1e9).toFixed(1).replace('.',',')+' GB'; }
async function readDL(){ try { const r = await fetch(GEN.base+'/provador/api/models'); if (!r.ok) return null; const j = await r.json(); DL.running = j.running; return j; } catch { return null; } }
function watchDownload(paint){
  if (DL.timer) return;
  const tick = async () => {
    const j = await readDL(); const box = $('dlBox'), btn = $('dlBtn');
    if (j && box){
      box.innerHTML = j.models.map(m => { const pct = m.total ? Math.min(100, m.done/m.total*100) : 0;
        const lab = m.status==='ok' ? 'pronto' : m.status==='downloading' ? `${fmtGB(m.done)} de ${fmtGB(m.total)}` : m.status==='error' ? 'falhou: '+m.error.replace(/[<>&]/g,'') : 'aguardando';
        return `<div class="dlrow"><span>${m.label}</span><div class="track"><div class="fill" style="width:${m.status==='ok'?100:pct}%"></div></div><small>${lab}</small></div>`; }).join('');
      if (btn){ btn.disabled = j.running; btn.textContent = j.running ? 'Baixando…' : j.models.some(m=>m.status==='error') ? 'Tentar de novo (continua de onde parou)' : 'Baixar modelos automaticamente'; }
    }
    if (j && !j.running){ clearInterval(DL.timer); DL.timer=null; if (j.models.every(m=>m.status==='ok')){ toast('Modelos prontos'); GEN.models=null; paint(); await checkServer(); paint(); } }
  };
  tick(); DL.timer = setInterval(tick, 1500);
}
function renderGenTop(){
  serverBlock();
  const go=document.createElement('div'); go.className='gen';
  go.innerHTML='<button class="btn big" id="genBtn">Gerar foto</button><div class="prog" hidden><div class="track"><div class="fill" id="genBar"></div></div><span id="genLab"></span></div>';

  const gal=document.createElement('div'); gal.id='gal'; listEl.append(gal);

function renderGenerator(){
  chips('Qualidade', ['Rápida','Alta (2 etapas)'], GEN.quality, i=>{ GEN.quality=i; });
  chips('Fotos por vez', ['1','2','4'], [1,2,4].indexOf(GEN.count), i=>{ GEN.count=[1,2,4][i]; });
  const h=document.createElement('div'); h.className='sect'; h.textContent='Descrição usada pela IA (inglês)'; listEl.append(h);
  const ta=document.createElement('textarea'); ta.id='pr'; ta.setAttribute('aria-label','Descrição da foto'); ta.style.minHeight='96px';

const LS='provador3d-slots';
function readSlots(){ try { return JSON.parse(localStorage.getItem(LS)) || [null,null,null]; } catch { return [null,null,null]; } }
function writeSlots(s){ try { localStorage.setItem(LS, JSON.stringify(s)); return true; } catch { return false; } }
function code(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function loadState(o){ const f=freshState(); S={ ...f, ...o, m:{...f.m,...(o.m||{}), gender:0}, p:{...f.p,...(o.p||{})} }; applyColors(); applyMorph(); renderTab(); }
function renderSaves(){
  const slots=readSlots();
  const h=document.createElement('div'); h.className='sect'; h.textContent='Espaços neste navegador'; listEl.append(h);
  const g=document.createElement('div'); g.className='slots';

    d.innerHTML=`<button class="btn" id="sv${i}">Salvar ${i+1}</button><button class="btn" id="ld${i}" ${s?'':'disabled'}>Carregar ${i+1}</button><small>${s? new Date(s.t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'vazio'}</small>`;

    $('ld'+i).onclick=()=>{ const sl=readSlots(); if (sl[i]){ loadState(sl[i].s); toast('Carregado'); } }; });
  const h2=document.createElement('div'); h2.className='sect'; h2.textContent='Código do personagem'; listEl.append(h2);
  const ta=document.createElement('textarea'); ta.id='codebox'; ta.value=code(); ta.setAttribute('aria-label','Código do personagem'); listEl.append(ta);
  const b=document.createElement('div'); b.className='bar'; b.style.padding='8px 0';
  b.innerHTML='<button class="btn" id="cpy">Copiar código</button><button class="btn" id="imp">Aplicar código colado</button>'; listEl.append(b);
  $('cpy').onclick=async()=>{ ta.value=code(); try { await navigator.clipboard.writeText(ta.value); toast('Código copiado'); } catch { ta.select(); toast('Selecionado. Copie manualmente.'); } };
  $('imp').onclick=()=>{ try { loadState(JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))))); toast('Personagem aplicado'); } catch { toast('Código inválido. Cole o texto completo.'); } };
  const n=document.createElement('p'); n.className='note'; n.textContent='O código guarda todos os ajustes. Serve para levar o personagem para outro aparelho ou, depois, para o protótipo no Unreal.'; listEl.append(n);
}
$('pReset').onclick=()=>{ const keep={skin:S.skin,hair:S.hair,cloth:S.cloth,eye:S.eye,lip:S.lip,makeup:S.makeup,hairLen:S.hairLen,outfit:S.outfit,ear:S.ear}; S={...freshState(),...keep}; applyMorph(); renderTab(); };
$('pRand').onclick=()=>{ const r=(a,b)=>a+Math.random()*(b-a);
  for (const k of ['weight','muscle','height','prop','cup','firm']) S.m[k]=r(0.15,0.9);
  for (const k of PAIRS) S.p[k]= (PAIR_DEF[k]||0) + (Math.random()<0.6 ? r(-0.45,0.45) : 0);
  const pick=a=>Math.floor(Math.random()*a.length);
  S.skin=pick(SKINS); S.hair=pick(HAIRS); S.eye=pick(IRIS); S.lip=pick(LIPS); S.hairLen=r(0.3,1); S.makeup=r(0.2,0.9); applyColors(); applyMorph(); renderTab(); };
$('pExtreme').onclick=()=>{ extreme=!extreme; $('pExtreme').classList.toggle('on',extreme); $('pExtreme').setAttribute('aria-pressed',extreme);
  if (!extreme){ for (const k in S.m) if (k!=='gender') S.m[k]=Math.min(1,Math.max(0,S.m[k])); for (const k in S.p) S.p[k]=Math.min(1,Math.max(-1,S.p[k])); applyMorph(); }
  renderTab(); };

applyColors(); applyMorph(); renderTab(); resize();
$('loading').hidden = true;
window.__apply = o => loadState(o);
window.__ready = true;
loop();
